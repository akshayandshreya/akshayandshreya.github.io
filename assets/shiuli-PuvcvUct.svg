<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <!-- Shiuli (night jasmine, the Bengal autumn flower): six twisted ivory petals and a saffron tube. Hand-built for the
       Kolkata card's falling floret. -->
  <defs>
    <radialGradient id="p" gradientUnits="userSpaceOnUse" cx="32" cy="32" r="26">
      <stop offset="0.18" stop-color="#f6dcc8"/>
      <stop offset="0.45" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f3eadc"/>
    </radialGradient>
    <path id="pt" d="M32 31C27 26 26 14 31 7C35 9 38 18 35.5 26C34.8 28.6 33.6 30.4 32 31Z"/>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#soft)" fill="url(#p)" stroke="#d9c7ae" stroke-width="0.7">
    <use href="#pt" xlink:href="#pt"/>
    <use href="#pt" xlink:href="#pt" transform="rotate(60 32 32)"/>
    <use href="#pt" xlink:href="#pt" transform="rotate(120 32 32)"/>
    <use href="#pt" xlink:href="#pt" transform="rotate(180 32 32)"/>
    <use href="#pt" xlink:href="#pt" transform="rotate(240 32 32)"/>
    <use href="#pt" xlink:href="#pt" transform="rotate(300 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="4.6" fill="#e2611a"/>
  <circle cx="31" cy="31" r="2" fill="#f59a3c"/>
</svg>
