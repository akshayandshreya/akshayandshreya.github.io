<!doctype html>
<html><head><meta charset="utf-8"><title>QA: line art, glyphs, sprites (not shipped)</title>
<script src="/tools/plates/vendor/motifs.js"></script>
<style>body{margin:0;background:#f2e8d8;font:12px sans-serif;color:#555}.row{display:flex;flex-wrap:wrap;gap:8px;padding:8px}.c{width:230px;height:230px;position:relative;background:#f7f0e4;border:1px solid #d9c3a0}.c svg,.c img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}.c span{position:absolute;left:4px;bottom:2px;z-index:2}.dark{background:#21484a}.ghost{background:#7e5a22;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;position:absolute;inset:6px;opacity:.25}</style></head>
<body><div class="row" id="r1"></div><div class="row" id="r2"></div><div class="row" id="r3"></div>
<script>
(async()=>{
  const names=['ganesh','shehnai','aripan','alpana','paag','topor','lotus_open','shankha'];
  const r1=document.getElementById('r1'), r2=document.getElementById('r2'), r3=document.getElementById('r3');
  const cell=(row,label,cls)=>{const d=document.createElement('div');d.className='c '+(cls||'');d.innerHTML='<span>'+label+'</span>';row.append(d);return d;};
  for(const n of names){
    for(const [row,p,src] of [[r1,1,'/assets/motifs/'+n+'.svg'],[r2,0.5,'/assets/motifs/'+n+'.svg']]){
      const d=cell(row,n+' opt p='+p); d.style.setProperty('--m-ink', '#7a2e22');
      const svg=await Motifs.load(src,{prefix:'q'+p+n}); d.append(svg); Motifs.draw(svg,p,{overlap:0.6});
    }
  }
  const t=cell(r3,'tirhuta'); t.style.color='#7e5a22'; t.insertAdjacentHTML('beforeend',await (await fetch('/assets/glyphs/tirhuta-mithila.svg')).text());
  const sp=await (await fetch('/assets/sprites.json')).json();
  for(const [k,src,cls] of [['ganesh',sp.motifs['opening-ganesh'].webp[320]],['kalash',sp.motifs['wedding-kalash'].webp[520]],['shankha',sp.motifs['wedding-shankha'].webp[400]],['diya+flame+glow',null],['marigold',sp.motifs['mehndi-marigold'].webp[440]],['banana',sp.motifs['haldi-banana'].webp[520]],['toran',sp.motifs['engagement-toran'].webp[960]],['bamboo R',sp.bamboo.right.file,'dark']]){
    const d=cell(r3,k,cls);
    if(src){const i=new Image();i.src='/assets/'+src;d.append(i);} else for(const id of ['closing-diya-glow','closing-diya','closing-diya-flame']){const i=new Image();i.src='/assets/'+sp.motifs[id].webp[480];d.append(i);}
  }
  for(const g of ['ghost-alpana','ghost-aripan']){const d=cell(r3,g+' (mask)');const m=document.createElement('div');m.className='ghost';m.style.webkitMaskImage='url(/assets/'+Object.values(sp.motifs[g].webp)[0]+')';d.append(m);}
  for(const [k,v] of Object.entries(sp.dabs)){const d=cell(r3,k);const i=new Image();i.src='/assets/'+v.file;d.append(i);}
  await new Promise(r=>setTimeout(r,800)); window.__READY=true;
})();
</script></body></html>
