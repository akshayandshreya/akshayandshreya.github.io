# Netlify (spec 9.5). Publish dist/: let Netlify run `npm run build` (Node 20) from this repo, or build on the dev
# desktop and run `netlify deploy --dir=dist --prod` from the repo root, or drag and drop dist/ in the Netlify UI.
#
# Everything else travels inside dist/, so all three ways behave the same:
#   dist/_headers    security headers and caching (spec 6.3), generated by scripts/prerender.mjs; it is the only
#                    header source for Netlify on purpose (one header defined in both places would be sent twice)
#   dist/_redirects  the language aliases (public/_redirects, VITE_BASE-prefixed by prerender.mjs)
#   dist/404.html    unknown paths: redirect.js sends the guest to /{lang}/ with query and hash, in any letter case
#
# No [[redirects]] on purpose. Measured 2026-11-02 with `netlify dev --offline` (netlify-cli 26.2.0) on a real
# dist/: an unforced "/en/* -> /en/" never fired (the request fell through to 404.html anyway), and a catch-all
# "/* -> /en/" sent /BN/ and /Hindi to English instead of their language.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
